[package]
name = "ast"
version = "0.1.0"
edition = "2021"
rust-version = "1.61"
description = "Walk a derived syntax tree: the Ast derive and the visitor! generator"
license = "MIT"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
repository = "https://github.com/yasuo-ozu/ast"

[workspace]
members = ["macro"]
resolver = "2"

[build-dependencies]
version_check = "0.9"

[dependencies]
ast-macro = { path = "macro", version = "0.1.0" }

[dev-dependencies]
trybuild = "1.0"
