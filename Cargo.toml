[package]
name = "visiting"
version = "0.2.0"
edition = "2021"
rust-version = "1.61"
description = "Walk a derived syntax tree: the Visiting derive and the define_visit! generator"
license = "MIT"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
repository = "https://github.com/yasuo-ozu/visiting"
keywords = ["ast", "visitor", "syntax-tree", "derive", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "parsing"]
# The README links the logo by its raw URL, so the file itself need not ship in the crate.
# The fixture crate is a workspace member for the cross-crate test, not content of this one, and it
# cannot be published (it only announces). `tests/announce_foreign.rs` goes with it: publishing
# strips a path dev-dependency, so a packaged copy would declare a test target that cannot compile.
# `tests/announce_interop.rs` needs only `announce`, which is a released dev-dependency, so it ships.
exclude = ["logo.png", "tests/foreign", "tests/announce_foreign.rs"]

[workspace]
members = ["macro", "tests/foreign"]
resolver = "2"

[lib]
path = "lib.rs"

[build-dependencies]
version_check = "0.9"

[dependencies]
visiting-macro = { path = "macro", version = "0.2.0" }
# The derive announces each node, and the code announce writes names it through `visit::__announce`.
# Only `Announce` and announce's hidden runtime are needed, so its proc-macro API stays off.
announce = { version = "0.1.1", default-features = false }

[dev-dependencies]
trybuild = "1.0"
# The tests write `#[announce]` themselves, which needs the default features.
announce = "0.1.1"
visiting-foreign-fixture = { path = "tests/foreign" }

# Several announcements of one item merge only on announce's `merge-announcements` branch, which a
# node deriving `Visiting` and also carrying `#[announce]` relies on. Drop this once it is released.
[patch.crates-io]
announce = { git = "https://github.com/yasuo-ozu/announce", branch = "merge-announcements" }
announce-core = { git = "https://github.com/yasuo-ozu/announce", branch = "merge-announcements" }
announce-macros = { git = "https://github.com/yasuo-ozu/announce", branch = "merge-announcements" }
