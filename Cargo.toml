[package]
name = "visiting"
version = "0.2.0"
edition = "2021"
rust-version = "1.61"
description = "Walk an announced syntax tree: the visiting check for announce, and the define_visit! generator"
license = "MIT"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
repository = "https://github.com/yasuo-ozu/visiting"
keywords = ["ast", "visitor", "syntax-tree", "announce", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "parsing"]
# The README links the logo by its raw URL, so the file itself need not ship in the crate.
# The fixture crate is a workspace member for the cross-crate test, not content of this one, and it
# cannot be published (it only announces). `tests/announce_foreign.rs` goes with it: publishing
# strips a path dev-dependency, so a packaged copy would declare a test target that cannot compile.
# `tests/announce_interop.rs` needs only `announce`, which is a released dev-dependency, so it ships.
exclude = ["logo.png", "tests/foreign", "tests/announce_foreign.rs"]

[workspace]
members = ["macro", "tests/foreign"]
resolver = "2"

[lib]
path = "lib.rs"

[build-dependencies]
version_check = "0.9"

[dependencies]
visiting-macro = { path = "macro", version = "0.2.0" }
# The check asserts that every follow entry is announced, naming `Announce` through `visit::__announce`.
# Only that trait is needed, so announce's proc-macro API stays off.
announce = { version = "0.2.0", default-features = false }

[dev-dependencies]
trybuild = "1.0"
# The tests declare their nodes with `#[announce]`, which needs the default features.
announce = "0.2.0"
visiting-foreign-fixture = { path = "tests/foreign" }
