[package]
name = "visiting"
version = "0.1.0"
edition = "2021"
rust-version = "1.61"
description = "Walk a derived syntax tree: the Visiting derive and the define_visit! generator"
license = "MIT"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
repository = "https://github.com/yasuo-ozu/visiting"
keywords = ["ast", "visitor", "syntax-tree", "derive", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "parsing"]
# The README links the logo by its raw URL, so the file itself need not ship in the crate.
# The fixture crate exists only for the cross-crate test; it is a workspace member, not content.
exclude = ["logo.png", "tests/foreign"]

[workspace]
members = ["macro"]
# Not a member: it depends on `announce`, whose own dependencies carry a higher MSRV than this
# crate claims, and the MSRV job checks every member. It is still built — as a path
# dev-dependency — whenever the tests are.
exclude = ["tests/foreign"]
resolver = "2"

[lib]
path = "lib.rs"

[build-dependencies]
version_check = "0.9"

[dependencies]
visiting-macro = { path = "macro", version = "0.1.0" }

[dev-dependencies]
trybuild = "1.0"
# Interop only: the generated code never names `announce`, and the protocol needs no dependency on
# it. `announce-helper` is a dependency of the macro crate, which parses the protocol.
announce = { path = "../ozu" }
visiting-foreign-fixture = { path = "tests/foreign" }
