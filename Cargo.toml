[package]
name = "ast"
version = "0.1.0"
edition = "2021"
rust-version = "1.61"
description = "Walk a derived syntax tree: the Ast derive and the visitor! generator"
license = "MIT"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
repository = "https://github.com/yasuo-ozu/ast"
keywords = ["ast", "visitor", "syntax-tree", "derive", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "parsing"]

[workspace]
members = ["macro"]
resolver = "2"

[lib]
path = "lib.rs"

[build-dependencies]
version_check = "0.9"

[dependencies]
ast-macro = { path = "macro", version = "0.1.0" }

[dev-dependencies]
trybuild = "1.0"
