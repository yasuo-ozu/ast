[package]
name = "visiting-macro"
version = "0.1.0"
edition = "2021"
rust-version = "1.61"
description = "Proc macros for the `visiting` crate"
license = "MIT"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
repository = "https://github.com/yasuo-ozu/visiting"
keywords = ["ast", "visitor", "syntax-tree", "derive", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "parsing"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
template-quote = "0.4"
proc-macro-error3 = { version = "3", default-features = false }
type-leak = "0.7.0"
# Only the protocol parser is used, `announce_core::helper` (`Input`, `Entry`, `CheckInput`,
# `OwnedAttrs`). `announce` itself re-exports the same module as `announce::helper`, but a proc macro
# needs nothing else of it, and depending on the core crate keeps the consumer-side crate out of the
# build graph.
announce-core = { path = "../../ozu/announce-core" }

[dependencies.syn]
version = "2.0"
features = ["full", "extra-traits", "visit", "visit-mut", "parsing", "printing"]
