# A crate that declares its nodes, for a visitor built in another crate. It depends on `visiting`
# alone: `#[visiting]` reaches announce through it.
[package]
name = "visiting-foreign-fixture"
version = "0.0.0"
edition = "2021"
rust-version = "1.61"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
visiting = { path = "../.." }
